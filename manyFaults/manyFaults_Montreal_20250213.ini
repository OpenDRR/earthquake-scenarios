description = Montreal M7.5 event, based on the 1732 event at 45,5 N, 73,6 W. Magnitude 7.5, hypocentral depth of 10km (GSC). Not much is known about the geometry of this earthquake, so we use a representative NW focal plane solution from the Nov 6 2012 Mw 3.86 event near Mtl (Bent et al., 2014): 304.74/42.73/85.22.
